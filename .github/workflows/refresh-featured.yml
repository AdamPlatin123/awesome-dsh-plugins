name: refresh-featured

# 星标榜（Star Top 20）自动刷新：
#   - schedule 每 20 分钟（GitHub Actions 高峰期可能延迟数分钟到数十分钟）
#   - workflow_dispatch 支持手动触发
# 变化时提交并推送 origin；配置了 DSH_EXT_TOKEN secret 时同步推送 dsh-ext 镜像。
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-featured
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh featured block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh-featured.py

      - name: Commit and push
        run: |
          git config user.name "featured-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en-US.md
          if git diff --cached --quiet; then
            echo "[skip] 榜单无变化，不提交"
            exit 0
          fi
          git commit -m "auto: 星标榜刷新 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      - name: Push mirror to dsh-ext (optional)
        env:
          DSH_EXT_TOKEN: ${{ secrets.DSH_EXT_TOKEN }}
        run: |
          if [ -z "${DSH_EXT_TOKEN}" ]; then echo "[skip] 未配置 DSH_EXT_TOKEN，仅推 origin"; exit 0; fi
          git remote add dsh-ext "https://x-access-token:${DSH_EXT_TOKEN}@github.com/dsh-external/awesome-dsh-plugins.git" || true
          git push dsh-ext HEAD:main
