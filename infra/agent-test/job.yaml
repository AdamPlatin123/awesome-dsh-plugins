# indexed Job：5 个 pod 各跑一个分片。每 pod 自动拿到 JOB_COMPLETION_INDEX=0..4。
# hostNetwork 直连 Qwen；QWEN_BASE_URL 由部署环境注入（不硬编码内网地址）。
apiVersion: batch/v1
kind: Job
metadata:
  name: dsh-plugin-test
  namespace: dsh-test
spec:
  completionMode: Indexed
  completions: 5
  parallelism: 5
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Never
      containers:
      - name: runner
        image: dsh-test-runner:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: TOTAL, value: "5"}
        - {name: QWEN_BASE_URL, value: "http://QWEN_HOST:8080"}   # 部署时替换为真实 Qwen vLLM 地址
        - {name: DEEPSEEK_API_KEY, value: none}
        command: ["sh", "-c", "shard-runner.sh"]
        volumeMounts:
        - {name: clones, mountPath: /clones, readOnly: true}
        - {name: radar, mountPath: /radar}
        - {name: dshhome, mountPath: /dsh-home, readOnly: true}
        resources:
          requests: { cpu: "2", memory: "3Gi" }
          limits:   { cpu: "4", memory: "4Gi" }
      volumes:
      - {name: clones, hostPath: {path: /clones, type: Directory}}
      - {name: radar, hostPath: {path: /radar, type: Directory}}
      - {name: dshhome, hostPath: {path: /dsh-home, type: Directory}}
